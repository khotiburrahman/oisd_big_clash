name: Combine OISD and LoyalSoldier Reject to Clash YAML & Geosite

on:
  schedule:
    - cron: '0 * * * *' # Berjalan otomatis setiap jam
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Download, Clean, and Generate Formats (including geosite.dat)
      run: |
        cat << 'EOF' > run.py
        import urllib.request
        import re
        import struct
        from datetime import datetime

        print("Mengunduh data...")
        req_headers = {"User-Agent": "Mozilla/5.0"}

        req_oisd = urllib.request.Request("https://raw.githubusercontent.com/sjhgvr/oisd/refs/heads/main/oisd_big.txt", headers=req_headers)
        req_loyal = urllib.request.Request("https://raw.githubusercontent.com/LoyalSoldier/clash-rules/release/reject.txt", headers=req_headers)

        oisd_data = urllib.request.urlopen(req_oisd).read().decode("utf-8")
        loyal_data = urllib.request.urlopen(req_loyal).read().decode("utf-8")

        unique_domains = set()
        total_input = 0
        total_duplikat = 0

        for line in (oisd_data + "\n" + loyal_data).splitlines():
            line = line.strip()
            if not line or line.startswith(("#", "!", "[", "-", "@@")):
                continue

            raw_domain = line.split()[0]

            if raw_domain.startswith("||"):
                raw_domain = raw_domain[2:]

            raw_domain = re.sub(r"[\^ \r\n\t]+$", "", raw_domain)
            domain = raw_domain.strip(".")

            if "." in domain:
                total_input += 1
                if domain in unique_domains:
                    total_duplikat += 1
                else:
                    unique_domains.add(domain)

        sorted_domains = sorted(list(unique_domains))
        total_unik = len(sorted_domains)

        # --- File 1: oisd_big.yaml (format '+.domain') ---
        q = chr(39)
        with open("oisd_big.yaml", "w", encoding="utf-8") as f:
            f.write("payload:\n")
            for d in sorted_domains:
                f.write(f"  - {q}+.{d}{q}\n")

        # --- File 2: oisd_big_old.yaml (format DOMAIN-SUFFIX) ---
        with open("oisd_big_old.yaml", "w", encoding="utf-8") as f:
            f.write("payload:\n")
            for d in sorted_domains:
                f.write(f"  - DOMAIN-SUFFIX,{d}\n")

        # --- File 3: geosite.dat (Dibuat lewat generator Python internal) ---
        print("Mengompilasi geosite.dat murni dengan Python...")
        
        def encode_varint(value):
            """Mengodekan integer ke format Protocol Buffers Varint"""
            bits = value & 0x7f
            value >>= 7
            ret = bytearray()
            while value:
                ret.append(bits | 0x80)
                bits = value & 0x7f
                value >>= 7
            ret.append(bits)
            return bytes(ret)

        def make_string_field(field_number, string_value):
            """Membuat field protobuf string bertipe length-delimited"""
            encoded_str = string_value.encode('utf-8')
            header = (field_number << 3) | 2
            return encode_varint(header) + encode_varint(len(encoded_str)) + encoded_str

        def make_submsg_field(field_number, submsg_bytes):
            """Membuat field protobuf sub-message bertipe length-delimited"""
            header = (field_number << 3) | 2
            return encode_varint(header) + encode_varint(len(submsg_bytes)) + submsg_bytes

        # Menyusun daftar domain ke dalam struktur format data Site (Protobuf v2fly)
        # Type 1 di V2ray Geosite artinya "Subdomain / Domain Suffix Matching"
        site_entries_bytes = bytearray()
        for d in sorted_domains:
            # Domain Entry: type (field 1, varint, value 1) + value (field 2, string)
            domain_entry = b'\x08\x01' + make_string_field(2, d)
            site_entries_bytes += make_submsg_field(2, domain_entry)

        # Bungkus semuanya ke dalam SiteList dengan tag/kategori "category-ads"
        # SiteList: country (field 1, string) + list (field 2, repeated submsg)
        site_list_bytes = make_string_field(1, "category-ads") + site_entries_bytes

        # Bungkus terakhir ke dalam struktur utama GeoSite container
        # GeoSite: entry (field 1, repeated submsg)
        geosite_file_bytes = make_submsg_field(1, site_list_bytes)

        with open("geosite.dat", "wb") as f:
            f.write(geosite_file_bytes)

        # --- README ---
        waktu_sekarang = datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S")
        with open("README.md", "w", encoding="utf-8") as f:
            f.write("# OISD Big & LoyalSoldier Reject Combined\n\n")
            f.write("### 📊 Statistik Pembaruan Terakhir\n")
            f.write(f"* **Waktu Pembaruan:** {waktu_sekarang} UTC\n")
            f.write(f"* **Total Domain Mentah Diunduh:** {total_input} domain\n")
            f.write(f"* **Total Domain Duplikat Identik Dibuang:** {total_duplikat} domain\n")
            f.write(f"* **Total Aturan Unik Akhir:** **{total_unik} domain**\n")

        print("Proses kompilasi dan pembuatan file selesai!")
        EOF
        python run.py
        rm run.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add oisd_big.yaml oisd_big_old.yaml geosite.dat README.md

        if git diff --staged --quiet; then
          echo "Tidak ada perubahan. Memicu keepalive..."
          date +%s > keepalive.txt
          git add keepalive.txt
          git commit -m "Keepalive: Perpanjang masa tenggang"
        else
          git commit -m "Update rules: YAML formats dan geosite.dat murni via Python"
        fi

        git push origin HEAD
