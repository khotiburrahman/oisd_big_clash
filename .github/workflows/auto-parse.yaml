name: Combine OISD and LoyalSoldier Reject to V2RayNG Geosite & YAML

on:
  schedule:
    - cron: '0 * * * *' # Berjalan otomatis setiap jam
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Download, Clean, and Generate V2RayNG Compatible Formats
      run: |
        cat << 'EOF' > run.py
        import urllib.request
        import re
        from datetime import datetime

        print("Mengunduh data...")
        req_headers = {"User-Agent": "Mozilla/5.0"}

        req_oisd = urllib.request.Request("https://raw.githubusercontent.com/sjhgvr/oisd/refs/heads/main/oisd_big.txt", headers=req_headers)
        req_loyal = urllib.request.Request("https://raw.githubusercontent.com/LoyalSoldier/clash-rules/release/reject.txt", headers=req_headers)

        oisd_data = urllib.request.urlopen(req_oisd).read().decode("utf-8")
        loyal_data = urllib.request.urlopen(req_loyal).read().decode("utf-8")

        unique_domains = set()
        total_input = 0
        total_duplikat = 0

        for line in (oisd_data + "\n" + loyal_data).splitlines():
            line = line.strip()
            if not line or line.startswith(("#", "!", "[", "-", "@@")):
                continue

            raw_domain = line.split()[0]

            if raw_domain.startswith("||"):
                raw_domain = raw_domain[2:]

            raw_domain = re.sub(r"[\^ \r\n\t]+$", "", raw_domain)
            domain = raw_domain.strip(".")

            if "." in domain:
                total_input += 1
                if domain in unique_domains:
                    total_duplikat += 1
                else:
                    unique_domains.add(domain)

        sorted_domains = sorted(list(unique_domains))
        total_unik = len(sorted_domains)

        # --- File 1: oisd_big.yaml (format '+.domain' untuk Clash) ---
        q = chr(39)
        with open("oisd_big.yaml", "w", encoding="utf-8") as f:
            f.write("payload:\n")
            for d in sorted_domains:
                f.write(f"  - {q}+.{d}{q}\n")

        # --- File 2: oisd_big_old.yaml (format DOMAIN-SUFFIX untuk Clash) ---
        with open("oisd_big_old.yaml", "w", encoding="utf-8") as f:
            f.write("payload:\n")
            for d in sorted_domains:
                f.write(f"  - DOMAIN-SUFFIX,{d}\n")

        # --- File 3: geosite.dat (V2FLY FORMAT - Compatible dengan V2RayNG) ---
        print("Mengompilasi geosite.dat format v2fly untuk V2RayNG...")
        
        def encode_varint(value):
            """Mengodekan integer ke format Protocol Buffers Varint"""
            if value == 0:
                return b'\x00'
            
            ret = bytearray()
            while value > 0:
                to_encode = value & 0x7f
                value >>= 7
                if value != 0:
                    to_encode |= 0x80
                ret.append(to_encode)
            return bytes(ret)

        def make_string_field(field_number, string_value):
            """Membuat field protobuf string (wire type 2)"""
            encoded_str = string_value.encode('utf-8')
            header = (field_number << 3) | 2
            return encode_varint(header) + encode_varint(len(encoded_str)) + encoded_str

        def make_int_field(field_number, value):
            """Membuat field protobuf integer (wire type 0)"""
            header = (field_number << 3) | 0
            return encode_varint(header) + encode_varint(value)

        def make_message_field(field_number, message_bytes):
            """Membuat field protobuf message (wire type 2)"""
            header = (field_number << 3) | 2
            return encode_varint(header) + encode_varint(len(message_bytes)) + message_bytes

        # V2FLY GEOSITE FORMAT
        # GeoSite {
        #   repeated GeoLocation entries = 1;
        # }
        # GeoLocation {
        #   required string country_code = 1;
        #   repeated Domain domains = 2;
        # }
        # Domain {
        #   required Type type = 1;     // 1 = Domain (suffix match)
        #   required string value = 2;
        # }

        # Buat list domain entries
        domains_data = bytearray()
        for domain in sorted_domains:
            # Domain message: type=1 (field 1) + value (field 2)
            domain_msg = make_int_field(1, 1) + make_string_field(2, domain)
            # Wrap sebagai repeated field 2 (domains)
            domains_data += make_message_field(2, domain_msg)

        # Buat GeoLocation message untuk kategori "ads"
        geo_location = make_string_field(1, "ads") + domains_data

        # Wrap sebagai repeated field 1 (entries) dalam GeoSite
        geosite_data = make_message_field(1, geo_location)

        with open("geosite.dat", "wb") as f:
            f.write(geosite_data)

        # --- File 4: rules.txt (format text untuk manual rules di V2RayNG) ---
        with open("rules.txt", "w", encoding="utf-8") as f:
            f.write("# V2RayNG Rules - Domain List\n")
            f.write("# Gunakan dengan rule: DOMAIN,example.com,REJECT\n\n")
            for d in sorted_domains:
                f.write(f"{d}\n")

        # --- README ---
        waktu_sekarang = datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S")
        with open("README.md", "w", encoding="utf-8") as f:
            f.write("# OISD Big & LoyalSoldier Reject Combined\n\n")
            f.write("### 📊 Statistik Pembaruan Terakhir\n")
            f.write(f"* **Waktu Pembaruan:** {waktu_sekarang} UTC\n")
            f.write(f"* **Total Domain Mentah Diunduh:** {total_input} domain\n")
            f.write(f"* **Total Domain Duplikat Dibuang:** {total_duplikat} domain\n")
            f.write(f"* **Total Aturan Unik Akhir:** **{total_unik} domain**\n\n")
            f.write("### 📁 File yang Dihasilkan\n\n")
            f.write("#### V2RayNG / Xray / sing-box\n")
            f.write("* **geosite.dat** - Format v2fly (binary protobuf)\n")
            f.write("  - Letakkan di: `/data/data/com.v2rayng.pro/app_profiler/`\n")
            f.write("  - Rule: `GEOSITE,ads,REJECT`\n\n")
            f.write("#### Clash / OpenClash\n")
            f.write("* **oisd_big.yaml** - Format modern ('+.domain')\n")
            f.write("* **oisd_big_old.yaml** - Format legacy (DOMAIN-SUFFIX)\n\n")
            f.write("#### Backup / Manual\n")
            f.write("* **rules.txt** - Daftar domain plain text\n\n")

        print("✅ Semua file berhasil dibuat!")
        print(f"   - geosite.dat (v2fly format) untuk V2RayNG: {len(geosite_data)} bytes")
        print(f"   - oisd_big.yaml & oisd_big_old.yaml untuk Clash")
        print(f"   - {total_unik} domain unik")
        EOF
        python run.py
        rm run.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add oisd_big.yaml oisd_big_old.yaml geosite.dat rules.txt README.md

        if git diff --staged --quiet; then
          echo "Tidak ada perubahan. Memicu keepalive..."
          date +%s > keepalive.txt
          git add keepalive.txt
          git commit -m "Keepalive: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        else
          git commit -m "Update rules: V2RayNG geosite.dat & Clash YAML - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        fi

        git push origin HEAD