name: Build & Compile All Adblock Rules (Geosite, Sing-box SRS, YAML)

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Debug info
      run: |
        echo "OS    : $(uname -srm)"
        echo "curl  : $(curl --version | head -1)"
        echo "python: $(python --version)"
        echo "git   : $(git --version)"

    # ============================================================
    # STEP 1: Unduh & bersihkan domain, lalu generate JSON/YAML/dat
    # ============================================================
    - name: Download, Clean, and Generate Base Rules
      run: |
        cat << 'PYEOF' > run.py
        import urllib.request
        import re
        import json
        from datetime import datetime, timezone

        print("Mengunduh data...")
        req_headers = {"User-Agent": "Mozilla/5.0"}

        urls = [
            "https://filters.adtidy.org/extension/chromium/filters/2.txt",
            "https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/adblock/pro.txt",
            "https://filters.adtidy.org/extension/chromium/filters/11.txt",
            "https://easylist.to/easylist/easylist.txt",
            "https://big.oisd.nl/domainswild",
            "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/apple.txt",
            "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/winoffice.txt",
            "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/samsung.txt",
            "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/xiaomi.txt",
            "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/smart-tv.txt"
        ]

        combined_data = ""
        for url in urls:
            try:
                print(f"Mengunduh: {url}")
                req = urllib.request.Request(url, headers=req_headers)
                data = urllib.request.urlopen(req, timeout=60).read().decode("utf-8")
                combined_data += data + "\n"
            except Exception as e:
                print(f"⚠️ Gagal mengunduh {url}: {e}")

        # --- Regex helper ---
        re_ipv4 = re.compile(r"^\d{1,3}(\.\d{1,3}){3}$")
        re_ip_like = re.compile(r"^[\d\.:]+$")
        re_scheme = re.compile(r"^https?://", re.IGNORECASE)
        re_port_caret = re.compile(r"[\^:].*$")
        re_bad_char = re.compile(r"[,\s\$\~\*\|\?/]")
        re_domain_chars = re.compile(r"^[a-zA-Z0-9_]([a-zA-Z0-9_\-\.]*[a-zA-Z0-9_])?$")

        unique_domains = set()
        total_input = 0
        total_duplikat = 0
        total_path_skipped = 0

        for line in combined_data.splitlines():
            line = line.strip()

            if not line or line.startswith(("#", "!", "[", "-", "@@")) or "##" in line or "#@#" in line:
                continue

            if "$" in line:
                line = line.split("$")[0].strip()
            if not line:
                continue

            parts = line.split()
            if not parts:
                continue
            raw_domain = parts[0]
            if len(parts) >= 2 and re_ip_like.match(parts[0]) and not re_ipv4.match(parts[1]):
                raw_domain = parts[1]

            if raw_domain.startswith("||"):
                raw_domain = raw_domain[2:]
            elif raw_domain.startswith("|"):
                raw_domain = raw_domain[1:]

            raw_domain = re_scheme.sub("", raw_domain)

            if "/" in raw_domain or "?" in raw_domain:
                total_path_skipped += 1
                continue

            if raw_domain.startswith("*."):
                raw_domain = raw_domain[2:]
            elif raw_domain.startswith("*"):
                raw_domain = raw_domain[1:]

            if not raw_domain:
                continue

            raw_domain = re_port_caret.sub("", raw_domain)
            domain = raw_domain.strip(" .")

            if not domain or re_bad_char.search(domain):
                continue
            if "." not in domain or not (4 <= len(domain) <= 253):
                continue
            if re_ipv4.match(domain):
                continue
            if not re_domain_chars.match(domain):
                continue

            total_input += 1
            if domain in unique_domains:
                total_duplikat += 1
            else:
                unique_domains.add(domain)

        sorted_domains = sorted(list(unique_domains))
        total_unik = len(sorted_domains)
        print(f"📊 Valid: {total_input} | Duplikat: {total_duplikat} | Path Di-skip: {total_path_skipped} | Unik: {total_unik}")

        # ============================================================
        # 1. YAML untuk Clash / OpenClash / Clash Meta
        # ============================================================
        q = chr(39)
        with open("oisd_big.yaml", "w", encoding="utf-8") as f:
            f.write("payload:\n")
            for d in sorted_domains:
                f.write(f"  - {q}+.{d}{q}\n")

        with open("oisd_big_old.yaml", "w", encoding="utf-8") as f:
            f.write("payload:\n")
            for d in sorted_domains:
                f.write(f"  - DOMAIN-SUFFIX,{d}\n")

        # ============================================================
        # 2. Plain text
        # ============================================================
        with open("rules.txt", "w", encoding="utf-8") as f:
            for d in sorted_domains:
                f.write(f"{d}\n")

        # ============================================================
        # 3. Rule-Set JSON untuk Sing-box (v1, v2, v3)
        # ============================================================
        for version in [1, 2, 3]:
            singbox_json = {
                "version": version,
                "rules": [{"domain_suffix": sorted_domains}]
            }
            with open(f"geosite-ads-all-v{version}.json", "w", encoding="utf-8") as f:
                json.dump(singbox_json, f, indent=2)

        # Default JSON (v2, untuk backward compat)
        with open("geosite-ads-all.json", "w", encoding="utf-8") as f:
            json.dump({"version": 2, "rules": [{"domain_suffix": sorted_domains}]}, f, indent=2)

        # ============================================================
        # 4. geosite.dat (v2fly protobuf — untuk Xray/V2Ray)
        # ============================================================
        def encode_varint(value):
            if value == 0:
                return b'\x00'
            ret = bytearray()
            while value > 0:
                to_encode = value & 0x7f
                value >>= 7
                if value != 0:
                    to_encode |= 0x80
                ret.append(to_encode)
            return bytes(ret)

        def make_string_field(field_number, string_value):
            encoded_str = string_value.encode('utf-8')
            return encode_varint((field_number << 3) | 2) + encode_varint(len(encoded_str)) + encoded_str

        def make_int_field(field_number, value):
            return encode_varint((field_number << 3) | 0) + encode_varint(value)

        def make_message_field(field_number, message_bytes):
            return encode_varint((field_number << 3) | 2) + encode_varint(len(message_bytes)) + message_bytes

        DOMAIN_TYPE_SUFFIX = 2
        domains_data = bytearray()
        for domain in sorted_domains:
            domain_msg = make_int_field(1, DOMAIN_TYPE_SUFFIX) + make_string_field(2, domain)
            domains_data += make_message_field(2, domain_msg)

        geo_location = make_string_field(1, "ads") + domains_data
        geosite_data = make_message_field(1, geo_location)

        with open("geosite.dat", "wb") as f:
            f.write(geosite_data)

        # ============================================================
        # 5. README.md
        # ============================================================
        waktu_sekarang = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S")
        with open("README.md", "w", encoding="utf-8") as f:
            f.write("# Combined Ads, Trackers, & Reject Rules\n\n")
            f.write("### 📊 Statistik Pembaruan Terakhir\n")
            f.write(f"* **Waktu Pembaruan:** {waktu_sekarang} UTC\n")
            f.write(f"* **Total Domain Unik:** **{total_unik} domain**\n")
            f.write(f"* **Aturan Path Diabaikan (Anti False-Positive):** {total_path_skipped} baris\n\n")

            f.write("### 📁 File Output & Kompatibilitas\n\n")
            f.write("#### Sing-box Rule-Set (.srs)\n")
            f.write("| File | Compiler Version | Kompatibel dengan |\n")
            f.write("|---|---|---|\n")
            f.write("| `geosite-ads-all-v1.srs` | sing-box 1.9.7 (SRS v1) | sing-box 1.8.0 – 1.9.x |\n")
            f.write("| `geosite-ads-all-v2.srs` | sing-box 1.10.7 (SRS v2) | sing-box 1.10.x |\n")
            f.write("| `geosite-ads-all.srs` | sing-box 1.11.5 (SRS v3) | sing-box 1.11.0+ / 1.12+ / terbaru |\n\n")

            f.write("#### Format Lain\n")
            f.write("| File | Format | Untuk |\n")
            f.write("|---|---|---|\n")
            f.write("| `geosite.dat` | Protobuf v2fly (tag `ads`) | Xray, V2Ray, V2RayNG |\n")
            f.write("| `oisd_big.yaml` | Clash Modern (`+.domain`) | OpenClash, Clash Meta, Mihomo |\n")
            f.write("| `oisd_big_old.yaml` | Clash Legacy (`DOMAIN-SUFFIX`) | Clash lama |\n")
            f.write("| `rules.txt` | Plain Text | AdGuard Home / Pi-hole / Dnsmasq |\n\n")

        print(f"✅ Pemrosesan Python Selesai ({total_unik} domain unik bersih)")
        PYEOF
        python run.py
        rm -f run.py

    # ============================================================
    # STEP 2: Compile SRS (versi di-PIN, tidak pakai API latest)
    # ============================================================
    - name: Compile .srs with sing-box (pinned versions)
      run: |
        # Tidak pakai `set -e` agar satu kompilasi gagal tidak hentikan semua
        set -uo pipefail

        compile_srs() {
          local URL=$1
          local JSON_FILE=$2
          local OUT_FILE=$3

          echo ""
          echo "📥 Compile: $OUT_FILE ← $JSON_FILE"
          echo "   URL: $URL"

          rm -rf tmp_sb && mkdir -p tmp_sb

          if ! curl -fsSL --retry 3 --retry-delay 3 --max-time 180 -o tmp_sb/sb.tar.gz "$URL"; then
            echo "❌ Gagal download: $URL"
            rm -rf tmp_sb
            return 1
          fi

          if ! tar -xzf tmp_sb/sb.tar.gz -C tmp_sb; then
            echo "❌ Gagal extract archive"
            rm -rf tmp_sb
            return 1
          fi

          local SB_BIN
          SB_BIN=$(find tmp_sb -name "sing-box" -type f | head -1)
          if [ -z "$SB_BIN" ]; then
            echo "❌ Binary 'sing-box' tidak ditemukan dalam archive"
            rm -rf tmp_sb
            return 1
          fi
          chmod +x "$SB_BIN"

          echo "⚙️  Version: $("$SB_BIN" version 2>&1 | head -1)"

          if ! "$SB_BIN" rule-set compile --output "$OUT_FILE" "$JSON_FILE"; then
            echo "❌ Kompilasi gagal untuk $OUT_FILE"
            rm -rf tmp_sb
            return 1
          fi

          rm -rf tmp_sb
          echo "✅ OK: $OUT_FILE"
          return 0
        }

        FAIL=0

        # --- v1: sing-box 1.9.7 → kompatibel 1.8.x – 1.9.x ---
        compile_srs \
          "https://github.com/SagerNet/sing-box/releases/download/v1.9.7/sing-box-1.9.7-linux-amd64.tar.gz" \
          "geosite-ads-all-v1.json" \
          "geosite-ads-all-v1.srs" \
          || { echo "⚠️  v1.srs gagal"; FAIL=1; }

        # --- v2: sing-box 1.10.7 → kompatibel 1.10.x ---
        compile_srs \
          "https://github.com/SagerNet/sing-box/releases/download/v1.10.7/sing-box-1.10.7-linux-amd64.tar.gz" \
          "geosite-ads-all-v2.json" \
          "geosite-ads-all-v2.srs" \
          || { echo "⚠️  v2.srs gagal"; FAIL=1; }

        # --- latest: sing-box 1.11.5 (PIN MANUAL, pakai SRS v3) ---
        # Kompatibel dengan sing-box 1.11.0+ / 1.12+ / 1.13+
        # Jika ingin upgrade versi compiler, ubah angka "1.11.5" di dua tempat di bawah.
        compile_srs \
          "https://github.com/SagerNet/sing-box/releases/download/v1.11.5/sing-box-1.11.5-linux-amd64.tar.gz" \
          "geosite-ads-all-v3.json" \
          "geosite-ads-all.srs" \
          || { echo "⚠️  latest.srs gagal"; FAIL=1; }

        echo ""
        echo "📦 Hasil kompilasi:"
        ls -lh geosite-ads-all*.srs 2>/dev/null || echo "(tidak ada file .srs yang dihasilkan)"

        if [ "$FAIL" -eq 1 ]; then
          echo ""
          echo "⚠️  Beberapa kompilasi gagal, tapi file lain tetap akan di-commit."
          echo "   Cek log di atas untuk detail. Kemungkinan: versi sing-box tidak ada, atau JSON tidak kompatibel."
        fi

        # Selalu exit 0 agar step commit di bawah tetap jalan
        exit 0

    # ============================================================
    # STEP 3: Commit & push (pakai `if: always()` agar tetap jalan)
    # ============================================================
    - name: Commit and Push Changes
      if: always()
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name  "github-actions[bot]"

        FILES="oisd_big.yaml oisd_big_old.yaml geosite.dat rules.txt \
               geosite-ads-all.json \
               geosite-ads-all-v1.json geosite-ads-all-v2.json geosite-ads-all-v3.json \
               geosite-ads-all.srs geosite-ads-all-v1.srs geosite-ads-all-v2.srs \
               README.md"

        ADDED=0
        for f in $FILES; do
          if [ -f "$f" ]; then
            git add "$f"
            ADDED=$((ADDED + 1))
          fi
        done
        echo "📦 File di-stage: $ADDED"

        if git diff --staged --quiet; then
          echo "ℹ️  Tidak ada perubahan data (kecuali README mungkin berubah)."
          echo "   (Jika README berubah karena timestamp, commit tetap akan dibuat.)"
        fi

        # Cek ulang setelah potensi skip
        if git diff --staged --quiet; then
          echo "✅ Selesai (tidak ada yang perlu di-commit)."
          exit 0
        fi

        git commit -m "Auto Update Rules: Clean Domain-Only & Multi-Version SRS - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

        if git push origin HEAD; then
          echo "✅ Push berhasil."
        else
          echo "❌ Push gagal. Kemungkinan ada konflik/commit baru di remote."
          exit 1
        fi