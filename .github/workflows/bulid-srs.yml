name: Build Sing-box Rule Set (.srs & .json)

on:
  schedule:
    - cron: '0 */23 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: sudo apt-get install -y jq

      - name: Download rules.txt
        run: |
          curl -L -o rules.txt \
            "https://raw.githubusercontent.com/khotiburrahman/oisd_big_clash/refs/heads/main/rules.txt"
          echo "📊 Jumlah baris: $(wc -l < rules.txt)"
          echo "--- 5 baris pertama ---"
          head -n 5 rules.txt

      - name: Generate rules.json (Format 1 Compatible)
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import sys

          with open("rules.txt", "r", encoding="utf-8") as f:
              lines = [line.strip() for line in f if line.strip() and not line.startswith('#')]

          if not lines:
              print("❌ rules.txt kosong")
              sys.exit(1)

          print(f"✅ {len(lines)} domain unik")

          # Schema resmi Rule-Set Sing-box Format 1 (Versi Universal)
          data = {
              "version": 1,
              "rules": [
                  {
                      "domain_suffix": lines
                  }
              ]
          }

          # Simpan ke geosite-ads-all.json
          with open("geosite-ads-all.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

          print("✅ geosite-ads-all.json berhasil dibuat")
          PYTHON_SCRIPT

      - name: Validate JSON
        run: |
          jq . geosite-ads-all.json > /dev/null && echo "✅ JSON valid"
          echo "Jumlah domain: $(jq '.rules[0].domain_suffix | length' geosite-ads-all.json)"

      - name: Download sing-box binary
        run: |
          API_URL="https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          DOWNLOAD_URL=$(curl -s $API_URL | jq -r '.assets[] | select(.name | test("linux-amd64\\.tar\\.gz$")) | .browser_download_url')
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "❌ Gagal mendapatkan URL"
            exit 1
          fi
          echo "📥 Mengunduh dari $DOWNLOAD_URL"
          curl -L -o sing-box.tar.gz "$DOWNLOAD_URL"
          tar -xzf sing-box.tar.gz
          find . -name "sing-box" -type f -executable | head -1 | xargs -I {} mv {} ./sing-box
          chmod +x ./sing-box
          echo "🔍 Versi sing-box:"
          ./sing-box version

      - name: Compile rule set to .srs
        run: |
          ./sing-box rule-set compile --output geosite-ads-all.srs geosite-ads-all.json
          ls -la geosite-ads-all.srs geosite-ads-all.json

      - name: Commit and Push
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add geosite-ads-all.srs geosite-ads-all.json rules.txt
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan, keepalive..."
            date +%s > keepalive.txt
            git add keepalive.txt
            git commit -m "Keepalive: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No changes"
          else
            git commit -m "Update Sing-box rule set (.srs & .json) - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          fi
          git push origin HEAD