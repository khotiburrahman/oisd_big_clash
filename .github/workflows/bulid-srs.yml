name: Build Sing-box Rule Set

on:
  schedule:
    - cron: '0 */6 * * *'  # setiap 6 jam
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate .srs from rules.txt
        run: |
          # (sama seperti kode di atas, tetapi mengambil rules.txt dari repo)
          # ...
      - name: Commit and Push
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add geosite-ads-all.srs
          git commit -m "Update Sing-box rule set" || echo "No changes"
          git push