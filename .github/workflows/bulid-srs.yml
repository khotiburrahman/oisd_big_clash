name: Build Sing-box Rule Set (.srs)

on:
  schedule:
    - cron: '0 */6 * * *'   # setiap 6 jam
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: sudo apt-get install -y jq

      - name: Download rules.txt
        run: |
          curl -L -o rules.txt \
            "https://raw.githubusercontent.com/khotiburrahman/oisd_big_clash/refs/heads/main/rules.txt"
          echo "📊 Jumlah baris: $(wc -l < rules.txt)"
          echo "--- 5 baris pertama ---"
          head -n 5 rules.txt

      - name: Generate rules.json
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import sys
          with open("rules.txt", "r", encoding="utf-8") as f:
              lines = [line.strip() for line in f if line.strip() and not line.startswith('#')]
          if not lines:
              print("❌ rules.txt kosong")
              sys.exit(1)
          print(f"✅ {len(lines)} domain unik")
          data = {"rules": [{"domain_suffix": d} for d in lines]}
          with open("rules.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          print("✅ rules.json berhasil dibuat")
          PYTHON_SCRIPT

      - name: Validate JSON
        run: |
          jq . rules.json > /dev/null && echo "✅ JSON valid"
          echo "Jumlah aturan: $(jq '.rules | length' rules.json)"

      - name: Download sing-box binary
        run: |
          API_URL="https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          DOWNLOAD_URL=$(curl -s $API_URL | jq -r '.assets[] | select(.name | test("linux-amd64\\.tar\\.gz$")) | .browser_download_url')
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "❌ Gagal mendapatkan URL"
            exit 1
          fi
          echo "📥 Mengunduh dari $DOWNLOAD_URL"
          curl -L -o sing-box.tar.gz "$DOWNLOAD_URL"
          tar -xzf sing-box.tar.gz
          find . -name "sing-box" -type f -executable | head -1 | xargs -I {} mv {} ./sing-box
          chmod +x ./sing-box
          echo "🔍 Versi sing-box:"
          ./sing-box version

      - name: Compile rule set to .srs
        run: |
          ./sing-box rule-set compile --output geosite-ads-all.srs rules.json
          ls -la geosite-ads-all.srs

      - name: Commit and Push
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add geosite-ads-all.srs
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan, keepalive..."
            date +%s > keepalive.txt
            git add keepalive.txt
            git commit -m "Keepalive: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No changes"
          else
            git commit -m "Update Sing-box rule set - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          fi
          git push origin HEAD